# 发布演练 (M3 任务 29) 蓝绿 Nginx 配置: 新版 (green=8090) 承接 10% 流量,
# 旧版 (blue=8088) 承接 90%; 回滚 = 删除 green 行由 * 全量承接并 reload
# (split_clients 不支持 0%, nginx 报 invalid percent value)。
# split_clients 以 $request_id 为键保证请求级随机; 响应头 X-HMS-Slot 标记命中槽位。
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    split_clients "${request_id}" $canary {
        10%     "green";
        *       "blue";
    }

    upstream blue {
        server host.docker.internal:8088;
    }
    upstream green {
        server host.docker.internal:8090;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/hms.crt;
        ssl_certificate_key /etc/nginx/certs/hms.key;

        location / {
            proxy_pass http://$canary;
            add_header X-HMS-Slot $canary always;
            proxy_read_timeout 30s;
        }
    }
}
