# HMS Nginx 入口 (生产): TLS + WSS 升级 + 三端路由
# M3 任务 24: TLS 证书放置于 deploy/nginx/certs/
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    server_tokens off;

    # ---- WebSocket 升级映射 ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream hms_backend {
        # backend 双副本 (docker compose prod); 蓝绿发布时在此切换 upstream 组 (任务 29)
        server backend:8088 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/hms.crt;
        ssl_certificate_key /etc/nginx/certs/hms.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 20m;

        # ---- 管理后台 (React) ----
        location / {
            root /srv/hms-web;
            try_files $uri /index.html;
        }

        # ---- 大屏看板 (Vue3) ----
        location /dashboard/ {
            alias /srv/hms-dashboard/;
            try_files $uri $uri/ /dashboard/index.html;
        }

        # ---- REST API ----
        location /api/ {
            proxy_pass http://hms_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ---- WebSocket (WSS): 长连接超时拉长 ----
        location /ws {
            proxy_pass http://hms_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /healthz {
            proxy_pass http://hms_backend;
        }
    }
}
