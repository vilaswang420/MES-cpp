; PgBouncer 配置 (M3 任务 25 启用; dev 环境直连 PG 不经过本组件)
; 切换前必须完成: 全量 SQL 会话无关审查 (PREPARE/临时表/SET 会话变量) + 单实例灰度
[databases]
hms = host=postgres-primary port=5432 dbname=hms

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; transaction 模式: 不允许依赖会话状态的 SQL (见 CONTRIBUTING 与 M3 任务 25)
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 50
reserve_pool_size = 5
reserve_pool_timeout = 3

server_idle_timeout = 300
log_connections = 0
log_disconnections = 0
stats_period = 60
