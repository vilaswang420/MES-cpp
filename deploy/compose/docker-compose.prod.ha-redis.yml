# ⚠ 暂不可用 (P0 风险) —— 在后端升级为 Redis 集群客户端之前, 请勿叠加本文件!
#
# 生产高可用叠加层 —— Redis Cluster (3 主 3 从)
# 用法 (后端支持集群后):
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.ha-redis.yml up -d
#
# ⚠ Redis Cluster 限制: 后端当前用 Drogon 内置 hiredis 单节点客户端,
#   不支持 Cluster 的 MOVED/ASK 重定向。一旦开启 Redis Cluster, 约 2/3 的 key
#   会因 CRC16 槽位落在其他节点而读写出错 (返回 MOVED, 后端无法跟随)。
#   须在后端改为集群客户端 (如 redis-plus-plus / hiredis-cluster 并启用拓扑刷新) 后方可启用。
#   在后端支持前, 保持 Redis 单实例 (redis-1) 即可, 无需叠加本文件。
#
# 本文件保留 Redis Cluster 定义, 以便客户端支持后一键启用。

services:
  # 把 redis-1 从单实例改为 cluster-enabled
  redis-1:
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--appendonly", "yes", "--cluster-announce-ip", "redis-1"]
  redis-2:
    image: redis:7-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--appendonly", "yes", "--cluster-announce-ip", "redis-2"]
    volumes:
      - mes_redis_2:/data
    restart: unless-stopped
  redis-3:
    image: redis:7-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--appendonly", "yes", "--cluster-announce-ip", "redis-3"]
    volumes:
      - mes_redis_3:/data
    restart: unless-stopped
  redis-4:
    image: redis:7-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--appendonly", "yes", "--cluster-announce-ip", "redis-4"]
    volumes:
      - mes_redis_4:/data
    restart: unless-stopped
  redis-5:
    image: redis:7-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--appendonly", "yes", "--cluster-announce-ip", "redis-5"]
    volumes:
      - mes_redis_5:/data
    restart: unless-stopped
  redis-6:
    image: redis:7-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--appendonly", "yes", "--cluster-announce-ip", "redis-6"]
    volumes:
      - mes_redis_6:/data
    restart: unless-stopped

  # 一次性集群初始化: 3主3从 (幂等: 已初始化则跳过)
  redis-cluster-init:
    image: redis:7-alpine
    entrypoint: ["sh", "-c"]
    command:
      - |
        if redis-cli -h redis-1 cluster info 2>/dev/null | grep -q cluster_state:ok; then
          echo "cluster already formed"; exit 0;
        fi;
        redis-cli --cluster create redis-1:6379 redis-2:6379 redis-3:6379 \
          redis-4:6379 redis-5:6379 redis-6:6379 \
          --cluster-replicas 1 --cluster-yes
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6

volumes:
  mes_redis_2:
  mes_redis_3:
  mes_redis_4:
  mes_redis_5:
  mes_redis_6:
