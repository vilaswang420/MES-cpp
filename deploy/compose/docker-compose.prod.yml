# 生产环境编排 (Redis 单实例 + backend 单副本; 默认含 PG 只读副本与 RMQ 3节点)
# 与 dev 的差异: Redis 单实例 (后端 Drogon 客户端不支持 Cluster MOVED) / RMQ 3节点 quorum / Nginx TLS+WSS / PgBouncer transaction
# 启动顺序: 证书先执行 scripts/gen_selfsigned_cert.ps1 (或 openssl 等价命令);
#          首次起 replica 前需先执行 deploy/postgres/init_replica.sh 初始化数据目录。
# 注意: 用 `docker compose up` (非 Swarm) 时, deploy.resources/replicas 均不生效, 扩容请用 --scale 或 Swarm。
# 4C8G 起步: 按部署手册 §3.5.6 精简 rabbitmq-2~3 与 postgres-replica。
services:
  postgres-primary:
    build:
      context: ../postgres
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: ${MES_PG_PASSWORD:?set MES_PG_PASSWORD}
      # 流复制 (任务 25 读写分离): 允许 replica 以 mes 账号拉取 WAL
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: ""
    command: ["postgres",
              "-c", "shared_preload_libraries=pg_cron",
              "-c", "cron.database_name=mes",
              "-c", "wal_level=replica",
              "-c", "max_wal_senders=4",
              "-c", "hot_standby=on"]
    volumes:
      - mes_pg_primary:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 任务 25 读写分离: 只读副本 (历史/审计/列表查询切 MES_PG_RO_DSN)
  # 数据目录由 init_replica.sh 通过 pg_basebackup 预填充 (含 standby.signal)
  postgres-replica:
    build:
      context: ../postgres
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: ${MES_PG_PASSWORD}
    command: ["postgres", "-c", "hot_standby=on"]
    volumes:
      - mes_pg_replica:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes"]
      interval: 5s
      timeout: 3s
      retries: 12

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres-primary
      DB_NAME: mes
      DB_USER: mes
      DB_PASSWORD: ${MES_PG_PASSWORD}
      # 任务 25: transaction 模式 — 已通过全量 SQL 会话无关审查
      # (无 prepared/LISTEN/会话级 SET; Drogon 每语句 PREPARE+EXECUTE+DEALLOCATE 自包含),
      # 双实例 2x64 连接超 PG 默认 max_connections=100 实证为切换依据
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
    ports:
      - "127.0.0.1:6432:6432"   # 仅绑本机, 公网不可达 (Docker 发布端口绕过 ufw, 必须显式绑 127.0.0.1)
    depends_on:
      postgres-primary:
        condition: service_healthy

  # ---- Redis 单实例 (后端 Drogon 内置 hiredis 单节点客户端, 不支持 Cluster MOVED 重定向) ----
  redis-1:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes",
              "--maxmemory", "768mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - mes_redis_1:/data

  # ---- RabbitMQ 3 节点集群 (任务 24; quorum 队列见 topology.prod.json) ----
  rabbitmq-1: &rmq-node
    image: rabbitmq:3.13-management
    hostname: rabbitmq-1
    environment:
      RABBITMQ_DEFAULT_USER: mes
      RABBITMQ_DEFAULT_PASS: ${MES_MQ_PASSWORD:?set MES_MQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${MES_MQ_COOKIE:?set MES_MQ_COOKIE}
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
      RABBITMQ_USE_LONGNAME: "false"
    volumes:
      - ../mq/topology.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq-runtime.conf:/etc/rabbitmq/conf.d/99-definitions.conf:ro
      - ./rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/98-cluster.conf:ro
      - mes_rmq_1:/var/lib/rabbitmq
  rabbitmq-2:
    <<: *rmq-node
    hostname: rabbitmq-2
    environment:
      RABBITMQ_DEFAULT_USER: mes
      RABBITMQ_DEFAULT_PASS: ${MES_MQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${MES_MQ_COOKIE}
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
      RABBITMQ_USE_LONGNAME: "false"
    volumes:
      - ../mq/topology.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq-runtime.conf:/etc/rabbitmq/conf.d/99-definitions.conf:ro
      - ./rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/98-cluster.conf:ro
      - mes_rmq_2:/var/lib/rabbitmq
    depends_on:
      - rabbitmq-1
  rabbitmq-3:
    <<: *rmq-node
    hostname: rabbitmq-3
    environment:
      RABBITMQ_DEFAULT_USER: mes
      RABBITMQ_DEFAULT_PASS: ${MES_MQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${MES_MQ_COOKIE}
      RABBITMQ_NODENAME: rabbit@rabbitmq-3
      RABBITMQ_USE_LONGNAME: "false"
    volumes:
      - ../mq/topology.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq-runtime.conf:/etc/rabbitmq/conf.d/99-definitions.conf:ro
      - ./rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/98-cluster.conf:ro
      - mes_rmq_3:/var/lib/rabbitmq
    depends_on:
      - rabbitmq-1

  backend:
    image: ${MES_REGISTRY:-registry.local}/mes-backend:${MES_VERSION:-latest}
    # 单副本。`docker compose up` 下 deploy.replicas 不生效; 需扩容用
    #   docker compose up -d --scale backend=2  (并相应在 deploy/nginx/nginx.conf 增加 upstream backend)
    # 走 Swarm (docker stack deploy) 才会认 deploy.resources/replicas。
    environment:
      # ⚠ 后端实际读配置文件 (config/drogon_config.json + config/rabbitmq.json),
      # 以下 env 仅作部署元信息声明, 真实连接串在挂载的配置里 (见 docs/DEPLOY_LINUX.md)
      MES_PG_DSN: "host=pgbouncer port=6432 dbname=mes user=mes password=${MES_PG_PASSWORD}"
      # 读写分离: 只读副本 DSN (任务 25; 4C8G 单实例档若删 postgres-replica, 此处改指 postgres-primary)
      MES_PG_RO_DSN: "host=postgres-replica port=5432 dbname=mes user=mes password=${MES_PG_PASSWORD}"
      MES_REDIS: "redis-1:6379"
      MES_MQ_URL: "amqp://mes:${MES_MQ_PASSWORD}@rabbitmq-1:5672/"
    volumes:
      # 生产配置目录 (drogon_config.json 指向 pgbouncer:6432 + 真实密码/JWT 密钥;
      # rabbitmq.json 指向 rabbitmq-1): 由部署手册第 5 步生成
      - ./config-prod:/app/config:ro
      - mes_backend_logs:/app/logs
    expose:
      - "8088"
    depends_on:
      pgbouncer:
        condition: service_started
      rabbitmq-1:
        condition: service_started

  # ---- IoT 采集服务 (P4-5.1) ----
  # 注: iot 实际只读挂载的 ./config-iot/iot.json (见部署手册 §5.5), 不读以下 environment。
  iot:
    image: ${MES_REGISTRY:-registry.local}/mes-iot:${MES_VERSION:-latest}
    volumes:
      - ./config-iot:/app/config:ro
    expose:
      - "8091"
    depends_on:
      rabbitmq-1:
        condition: service_started
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8091 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 10s
      timeout: 3s
      retries: 6

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 证书: 自签用 scripts/gen_selfsigned_cert.ps1 产物; 正式域名用 certbot 产物
      # (手册第 6 步: 把 fullchain.pem/privkey.pem 复制为 mes.crt/mes.key)
      - ../nginx/certs:/etc/nginx/certs:ro
      # 前端静态产物 (手册第 7 步从 web/dashboard 镜像提取或本机 npm run build)
      - ./web-dist:/srv/mes-web:ro
      - ./dashboard-dist:/srv/mes-dashboard:ro
    depends_on:
      - backend

  # 可观测性 (任务 28): 指标抓取 + 告警规则评估
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - mes_prometheus:/data
    ports:
      - "9090:9090"
    depends_on:
      - backend

volumes:
  mes_pg_primary:
  mes_pg_replica:
  mes_redis_1:
  mes_rmq_1:
  mes_rmq_2:
  mes_rmq_3:
  mes_prometheus:
  mes_backend_logs:
