# 生产环境编排 (M3 任务 24 定稿)
# 与 dev 的差异: backend 双副本 / Redis Cluster 3主3从 / RMQ 3节点 quorum / Nginx TLS+WSS / PgBouncer transaction
# 启动顺序: 证书先执行 scripts/gen_selfsigned_cert.ps1 (或 openssl 等价命令);
#          首次起 replica 前需先执行 deploy/postgres/init_replica.sh 初始化数据目录。
services:
  postgres-primary:
    build:
      context: ../postgres
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: ${MES_PG_PASSWORD:?set MES_PG_PASSWORD}
      # 流复制 (任务 25 读写分离): 允许 replica 以 mes 账号拉取 WAL
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: ""
    command: ["postgres",
              "-c", "shared_preload_libraries=pg_cron",
              "-c", "cron.database_name=mes",
              "-c", "wal_level=replica",
              "-c", "max_wal_senders=4",
              "-c", "hot_standby=on"]
    volumes:
      - mes_pg_primary:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 任务 25 读写分离: 只读副本 (历史/审计/列表查询切 MES_PG_RO_DSN)
  # 数据目录由 init_replica.sh 通过 pg_basebackup 预填充 (含 standby.signal)
  postgres-replica:
    build:
      context: ../postgres
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: ${MES_PG_PASSWORD}
    command: ["postgres", "-c", "hot_standby=on"]
    volumes:
      - mes_pg_replica:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes"]
      interval: 5s
      timeout: 3s
      retries: 12

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres-primary
      DB_NAME: mes
      DB_USER: mes
      DB_PASSWORD: ${MES_PG_PASSWORD}
      # 任务 25: transaction 模式 — 已通过全量 SQL 会话无关审查
      # (无 prepared/LISTEN/会话级 SET; Drogon 每语句 PREPARE+EXECUTE+DEALLOCATE 自包含),
      # 双实例 2x64 连接超 PG 默认 max_connections=100 实证为切换依据
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
    ports:
      - "6432:6432"
    depends_on:
      postgres-primary:
        condition: service_healthy

  # ---- Redis Cluster 3主3从 (任务 24; 显式节点 + 独立卷, 避免 replicas 共享卷冲突) ----
  redis-1: &redis-node
    image: redis:7-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--appendonly", "yes", "--cluster-announce-ip", "redis-1"]
    volumes:
      - mes_redis_1:/data
  redis-2:
    <<: *redis-node
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--appendonly", "yes", "--cluster-announce-ip", "redis-2"]
    volumes:
      - mes_redis_2:/data
  redis-3:
    <<: *redis-node
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--appendonly", "yes", "--cluster-announce-ip", "redis-3"]
    volumes:
      - mes_redis_3:/data
  redis-4:
    <<: *redis-node
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--appendonly", "yes", "--cluster-announce-ip", "redis-4"]
    volumes:
      - mes_redis_4:/data
  redis-5:
    <<: *redis-node
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--appendonly", "yes", "--cluster-announce-ip", "redis-5"]
    volumes:
      - mes_redis_5:/data
  redis-6:
    <<: *redis-node
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--appendonly", "yes", "--cluster-announce-ip", "redis-6"]
    volumes:
      - mes_redis_6:/data

  # 一次性集群初始化: 3主3从 (幂等: 已初始化则跳过)
  redis-cluster-init:
    image: redis:7-alpine
    entrypoint: ["sh", "-c"]
    command:
      - |
        if redis-cli -h redis-1 cluster info | grep -q cluster_state:ok; then
          echo "cluster already formed"; exit 0;
        fi;
        redis-cli --cluster create redis-1:6379 redis-2:6379 redis-3:6379 \
          redis-4:6379 redis-5:6379 redis-6:6379 \
          --cluster-replicas 1 --cluster-yes
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6

  # ---- RabbitMQ 3 节点集群 (任务 24; quorum 队列见 topology.prod.json) ----
  rabbitmq-1: &rmq-node
    image: rabbitmq:3.13-management
    hostname: rabbitmq-1
    environment:
      RABBITMQ_DEFAULT_USER: mes
      RABBITMQ_DEFAULT_PASS: ${MES_MQ_PASSWORD:?set MES_MQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${MES_MQ_COOKIE:?set MES_MQ_COOKIE}
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
      RABBITMQ_USE_LONGNAME: "false"
    volumes:
      - ../mq/topology.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq-runtime.conf:/etc/rabbitmq/conf.d/99-definitions.conf:ro
      - ./rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/98-cluster.conf:ro
      - mes_rmq_1:/var/lib/rabbitmq
  rabbitmq-2:
    <<: *rmq-node
    hostname: rabbitmq-2
    environment:
      RABBITMQ_DEFAULT_USER: mes
      RABBITMQ_DEFAULT_PASS: ${MES_MQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${MES_MQ_COOKIE}
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
      RABBITMQ_USE_LONGNAME: "false"
    volumes:
      - ../mq/topology.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq-runtime.conf:/etc/rabbitmq/conf.d/99-definitions.conf:ro
      - ./rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/98-cluster.conf:ro
      - mes_rmq_2:/var/lib/rabbitmq
    depends_on:
      - rabbitmq-1
  rabbitmq-3:
    <<: *rmq-node
    hostname: rabbitmq-3
    environment:
      RABBITMQ_DEFAULT_USER: mes
      RABBITMQ_DEFAULT_PASS: ${MES_MQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${MES_MQ_COOKIE}
      RABBITMQ_NODENAME: rabbit@rabbitmq-3
      RABBITMQ_USE_LONGNAME: "false"
    volumes:
      - ../mq/topology.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq-runtime.conf:/etc/rabbitmq/conf.d/99-definitions.conf:ro
      - ./rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/98-cluster.conf:ro
      - mes_rmq_3:/var/lib/rabbitmq
    depends_on:
      - rabbitmq-1

  backend:
    image: ${MES_REGISTRY:-registry.local}/mes-backend:${MES_VERSION:-latest}
    deploy:
      # 任务 24/26: 无状态扩容 (JWT 黑名单/权限全走 Redis; outbox advisory lock 互斥投递)
      replicas: 2
    environment:
      # ⚠ 后端实际读配置文件 (config/drogon_config.json + config/rabbitmq.json),
      # 以下 env 仅作部署元信息声明, 真实连接串在挂载的配置里 (见 docs/DEPLOY_LINUX.md)
      MES_PG_DSN: "host=pgbouncer port=6432 dbname=mes user=mes password=${MES_PG_PASSWORD}"
      # 读写分离: 只读副本 DSN (任务 25)
      MES_PG_RO_DSN: "host=postgres-replica port=5432 dbname=mes user=mes password=${MES_PG_PASSWORD}"
      MES_REDIS: "redis-1:6379"
      MES_MQ_URL: "amqp://mes:${MES_MQ_PASSWORD}@rabbitmq-1:5672/"
    volumes:
      # 生产配置目录 (drogon_config.json 指向 pgbouncer:6432 + 真实密码/JWT 密钥;
      # rabbitmq.json 指向 rabbitmq-1): 由部署手册第 5 步生成
      - ./config-prod:/app/config:ro
      - mes_backend_logs:/app/logs
    expose:
      - "8088"
    depends_on:
      pgbouncer:
        condition: service_started
      rabbitmq-1:
        condition: service_started

  # ---- IoT 采集服务 (P4-5.1) ----
  iot:
    image: ${MES_REGISTRY:-registry.local}/mes-iot:${MES_VERSION:-latest}
    environment:
      # iot.json 通过挂载覆盖 (backend_url 指向 backend:8088 内网, amqp 指向 rabbitmq-1)
      MES_IOT_BACKEND_URL: "http://backend:8088"
      MES_IOT_AMQP_URL: "amqp://mes:${MES_MQ_PASSWORD}@rabbitmq-1:5672/"
    volumes:
      - ./config-iot:/app/config:ro
    expose:
      - "8091"
    depends_on:
      rabbitmq-1:
        condition: service_started
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8091 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 10s
      timeout: 3s
      retries: 6

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 证书: 自签用 scripts/gen_selfsigned_cert.ps1 产物; 正式域名用 certbot 产物
      # (手册第 6 步: 把 fullchain.pem/privkey.pem 复制为 mes.crt/mes.key)
      - ../nginx/certs:/etc/nginx/certs:ro
      # 前端静态产物 (手册第 7 步从 web/dashboard 镜像提取或本机 npm run build)
      - ./web-dist:/srv/mes-web:ro
      - ./dashboard-dist:/srv/mes-dashboard:ro
    depends_on:
      - backend

  # 可观测性 (任务 28): 指标抓取 + 告警规则评估
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - mes_prometheus:/data
    ports:
      - "9090:9090"
    depends_on:
      - backend

volumes:
  mes_pg_primary:
  mes_pg_replica:
  mes_redis_1:
  mes_redis_2:
  mes_redis_3:
  mes_redis_4:
  mes_redis_5:
  mes_redis_6:
  mes_rmq_1:
  mes_rmq_2:
  mes_rmq_3:
  mes_prometheus:
  mes_backend_logs:
