# 开发环境编排 (M0): 定制 PG16 + Redis7 单实例(禁 cluster) + RabbitMQ 3.13-management
# 生产编排见 docker-compose.prod.yml (M3)
#
# 国内 Docker 镜像加速 (解决 docker.io 拉取超时):
#   本编排使用了 redis/rabbitmq 等公共镜像, 国内直连 docker.io 会超时。
#   需在 /etc/docker/daemon.json 中配置 registry-mirrors:
#     腾讯云: https://mirror.ccs.tencentyun.com
#     阿里云: https://<your-id>.mirror.aliyuncs.com
#   配置后执行: sudo systemctl restart docker
services:
  postgres:
    build:
      context: ../postgres
    container_name: mes-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes_dev_pwd
    volumes:
      - mes_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: mes-redis
    # 开发环境单实例, 显式禁用 cluster 模式 (M3 才切 Redis Cluster)
    command: ["redis-server", "--appendonly", "yes", "--cluster-enabled", "no"]
    ports:
      - "6379:6379"
    volumes:
      - mes_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mes-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mes
      RABBITMQ_DEFAULT_PASS: mes_dev_pwd
    volumes:
      - mes_mq_data:/var/lib/rabbitmq
      # 首次启动自动声明拓扑 (exchange/queue/DLX/retry, 见 deploy/mq/topology.json)
      - ../mq/topology.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq-runtime.conf:/etc/rabbitmq/conf.d/99-definitions.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mes_pg_data:
  mes_redis_data:
  mes_mq_data:
