# 开发环境编排 (M0): 定制 PG16 + Redis7 单实例(禁 cluster) + RabbitMQ 3.13-management
# 生产编排见 docker-compose.prod.yml (M3)
services:
  postgres:
    build:
      context: ../postgres
    container_name: hms-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms_dev_pwd
    volumes:
      - hms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hms"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: hms-redis
    # 开发环境单实例, 显式禁用 cluster 模式 (M3 才切 Redis Cluster)
    command: ["redis-server", "--appendonly", "yes", "--cluster-enabled", "no"]
    ports:
      - "6379:6379"
    volumes:
      - hms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: hms
      RABBITMQ_DEFAULT_PASS: hms_dev_pwd
    volumes:
      - hms_mq_data:/var/lib/rabbitmq
      # 首次启动自动声明拓扑 (exchange/queue/DLX/retry, 见 deploy/mq/topology.json)
      - ../mq/topology.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq-runtime.conf:/etc/rabbitmq/conf.d/99-definitions.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  hms_pg_data:
  hms_redis_data:
  hms_mq_data:
